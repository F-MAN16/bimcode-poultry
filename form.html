<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BIMCODE POULTRY - Login / Sign Up</title>
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #00c851, #a8e063);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0;
    }

    .container {
      width: 420px;
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.2);
      padding: 30px;
      position: relative;
      overflow: hidden;
      animation: fadeIn 0.7s ease;
    }

    @keyframes fadeIn {
      from {opacity: 0; transform: translateY(20px);}
      to {opacity: 1; transform: translateY(0);}
    }

    .logo {
      text-align: center;
      margin-bottom: 20px;
    }

    .logo img {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      border: 3px solid #00c851;
      object-fit: cover;
    }

    h2 {
      text-align: center;
      color: #00c851;
      margin-bottom: 15px;
      font-weight: bold;
    }

    form {
      display: none;
      animation: slide 0.4s ease;
    }

    @keyframes slide {
      from {opacity: 0; transform: translateY(10px);}
      to {opacity: 1; transform: translateY(0);}
    }

    form.active {
      display: block;
    }

    label {
      display: block;
      font-weight: bold;
      margin-top: 10px;
      color: #333;
    }

    input[type="text"],
    input[type="password"],
    input[type="email"],
    input[type="date"] {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 6px;
      transition: 0.3s;
    }

    input[type="text"]:focus,
    input[type="password"]:focus,
    input[type="email"]:focus {
      border-color: #00c851;
      box-shadow: 0 0 5px #00c851;
      outline: none;
    }

    input[type="submit"] {
      width: 100%;
      background-color: #00c851;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 6px;
      font-size: 16px;
      margin-top: 20px;
      cursor: pointer;
      transition: 0.3s;
    }

    input[type="submit"]:hover {
      background-color: #009e44;
      transform: scale(1.03);
    }

    .tab-buttons {
      display: flex;
      justify-content: center;
      margin-bottom: 15px;
    }

    .tab-buttons button {
      flex: 1;
      background-color: white;
      border: 2px solid #00c851;
      color: #00c851;
      font-weight: bold;
      padding: 10px 0;
      cursor: pointer;
      transition: 0.3s;
      border-radius: 6px;
      margin: 0 5px;
    }

    .tab-buttons button.active {
      background-color: #00c851;
      color: white;
    }

    .tab-buttons button:hover {
      background-color: #57e389;
      color: white;
    }

    /* Success message */
    #successMsg {
      display: none;
      text-align: center;
      margin-top: 20px;
      font-weight: bold;
      color: #009e44;
    }

    #successMsg button {
      margin-top: 10px;
      background-color: #00c851;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      transition: 0.3s;
    }

    #successMsg button:hover {
      background-color: #009e44;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <img src="images/330c13ce-cd9e-4d3a-a5e3-d5a00a44a821.png" alt="BIMCODE Logo">
    </div>

    <div class="tab-buttons">
      <button id="loginTab" class="active" onclick="showLogin()">Login</button>
      <button id="signupTab" onclick="showSignup()">Sign Up</button>
    </div>

    <!-- LOGIN FORM -->
    <form id="loginForm" class="active">
      <h2>Welcome Back</h2>
      <label>Email</label>
      <input type="email" id="loginEmail" placeholder="Enter your email" required />
      <label>Password</label>
      <input type="password" id="loginPassword" placeholder="Enter your password" required />
      <input type="submit" value="Login" />
    </form>

    <!-- SIGNUP FORM -->
    <form id="signupForm">
      <h2>Create Account</h2>
      <label>Username</label>
      <input type="text" id="signupUsername" placeholder="Enter your username" required />
      <label>First name</label>
      <input type="text" id="signupFirstName" placeholder="Enter your first name" required />
      <label>Surname</label>
      <input type="text" id="signupSurname" placeholder="Enter your surname" required />
      <label>Password</label>
      <input type="password" id="signupPassword" placeholder="Enter your password" required />
      <label>Confirm Password</label>
      <input type="password" id="signupConfirmPassword" placeholder="Confirm password" required />
      <label>Birthday</label>
      <input type="date" id="signupBirthday" required />
      <label>Email</label>
      <input type="email" id="signupEmail" placeholder="Enter your email" required />
      <input type="submit" value="Create Account" />
    </form>

    <!-- Success Message -->
    <div id="successMsg">
      Account created successfully!
      <br>
      <button onclick="showLogin()">Go to Login</button>
    </div>
  </div>

  <script>
    const loginForm = document.getElementById('loginForm');
    const signupForm = document.getElementById('signupForm');
    const loginTab = document.getElementById('loginTab');
    const signupTab = document.getElementById('signupTab');
    const successMsg = document.getElementById('successMsg');

    function showSignup() {
      loginForm.classList.remove('active');
      signupForm.classList.add('active');
      signupTab.classList.add('active');
      loginTab.classList.remove('active');
      successMsg.style.display = 'none';
    }

    function showLogin() {
      signupForm.classList.remove('active');
      loginForm.classList.add('active');
      loginTab.classList.add('active');
      signupTab.classList.remove('active');
      successMsg.style.display = 'none';
    }

    // SIGNUP FUNCTION
    signupForm.addEventListener('submit', function(event) {
      event.preventDefault();

      const username = document.getElementById('signupUsername').value.trim();
      const firstName = document.getElementById('signupFirstName').value.trim();
      const surname = document.getElementById('signupSurname').value.trim();
      const email = document.getElementById('signupEmail').value.trim();
      const password = document.getElementById('signupPassword').value;
      const confirmPassword = document.getElementById('signupConfirmPassword').value;
      const birthday = document.getElementById('signupBirthday').value;

      if(password !== confirmPassword){
        alert("Passwords do not match!");
        return;
      }

      let users = JSON.parse(localStorage.getItem('users')) || [];

      if(users.find(u => u.email === email)){
        alert("Email already registered!");
        return;
      }

      users.push({username, firstName, surname, email, password, birthday});
      localStorage.setItem('users', JSON.stringify(users));

      signupForm.reset();
      signupForm.style.display = 'none';
      successMsg.style.display = 'block';
    });

    // LOGIN FUNCTION
    loginForm.addEventListener('submit', function(event){
      event.preventDefault();

      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;

      let users = JSON.parse(localStorage.getItem('users')) || [];
      const user = users.find(u => u.email === email && u.password === password);

      if(user){
        // Store current logged-in user
        localStorage.setItem('currentUser', JSON.stringify(user));

        // Redirect to homepage
        window.location.href = 'home.html';
      } else {
        alert("Invalid email or password!");
      }
    });
  </script>
</body>
</html>
